#version: "3.9"

services:
  db:
    image: postgres:latest
    container_name: hotel-postgres
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
      #volumes:
      #- pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
